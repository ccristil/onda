[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onda"
version = "0.1.0"
description = "Ollama-style CLI for local TTS models"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "piper-tts>=1.4",
]

[project.optional-dependencies]
kokoro = ["kokoro", "espeak-ng"]
orpheus = ["llama-cpp-python", "snac"]
docs = ["pymupdf", "python-docx"]
dev = ["pytest>=8", "pytest-mock>=3"]

[project.scripts]
onda = "onda.main:app"

[tool.hatch.build.targets.wheel]
packages = ["onda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
